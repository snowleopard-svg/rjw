<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJW Career Platform - Home</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <!-- Home Header / Navbar -->
<header class="site-header">
  <div class="brand">ResTrak</div>
  <nav class="nav-links">
    <a href="shell.html" class="nav-link nav-link--active">Home</a>
    <a href="resume.html" class="nav-link">Resume Builder</a>
    <a href="jobboard.html" class="nav-link">Job Board</a>
    <a href="tracker.html" class="nav-link">Application Tracker</a>
  </nav>
</header>

  <div class="dashboard">
    <div class="dashboard-main">
      <!--      Welcome Message       -->
      <div class="welcome">
        <h1>Welcome to ResTrak</h1>
        <p>All in 1 hub to build start your career</p>
      </div>

      <div class="cards-grid">

        <!--      Resume Container       -->
        <article class="feature-card">
          <h2>Resume Builder</h2>

          <div class="card-actions">
            <a href="resume.html" class="action-btn">
              <span class="btn-title">Edit Resume</span>
              <span class="btn-tag">Resume.html</span>
            </a>

            <button type="button" class="action-btn">
              <span class="btn-title">Preview</span>
              <span class="btn-tag">larger preview</span>
            </button>
          </div>
        </article>
        
        <!--      Job Board Container       -->
        <article class="feature-card">
          <h2>Job Board</h2>
          <div class="card-actions">
            <a href="jobboard.html">
              <span class="btn-title">Search</span>
            </a>
          </div>

        </article>

      </div>
    </div>
  </div>


</body>
</html>
