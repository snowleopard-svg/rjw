<!DOCTYPE html> 

<html>
<head>
    <title>moo</title>
    <link rel="stylesheet" href="whateverstyle.css">
    <nav id="navbar">
        <a id="home-link" class = "nav-option" href="index.html">Home</a>
        <a id="jobs-link" class = "nav-option" href="jobs.html">Jobs</a>
        <a id="companies-link" class = "nav-option" href="companies.html">Companies</a>
        <a id="contact-link" class = "nav-option" href="contact.html">Contact</a>
    </nav>
</head>

<body>

    <h1 id="page-title">Available Jobs</h1>

    <input
        type="text"
        id="searchBar"
        placeholder="Search jobs..."
    >

    <div id="job-container">

        <div id="job-card-example" class="job-card">
            <h2 id="job-title-example">Example</h2>

            <p id="company-info">
                <strong id="company-label">Company:</strong>
                Microsoft
            </p>

            <p id="location-info">
                <strong id="location-label">Location:</strong>
                Toronto
            </p>

            <p id="salary-info">
                <strong id="salary-label">Salary:</strong>
                $90,000
            </p>

            <button id="apply-btn">
                Apply
            </button>
        </div>

            <script src="whateverscript.js"></script>
    </div>

    <h2 id="post-job-heading">
        Don't see your job? You can add it here
    </h2>

    <button id="openBtn">
        Post a Job
    </button>

    <div id="popup" class="popup">

        <div id="popup-content" class="popup-content">

            <span id="closeBtn">✖</span>

            <h2 id="popup-title">
                Post a New Job
            </h2>

            <form id="jobForm">
                <div class="postjob">
                    <input
                    type="text"
                    id="title"
                    placeholder="Job Title"
                    required>
                </div>
                
                <div class="postjob">
                    <input
                    type="text"
                    id="company"
                    placeholder="Company"
                    required>
                </div>
                
                <div class="postjob">
                    <input
                    type="text"
                    id="location"
                    placeholder="Location"
                    required>
                </div>
                
                <div class="postjob">
                    <textarea id="description" placeholder="Job Description"></textarea>
                </div>
                
                <div class="postjob">
                    <button id="submit-job-btn" type="submit">Submit Job</button>
                </div>
                
            </form>

        </div>

    </div>

    <div id="tracker-container" >

        <h3 id="tracker-title">
            Track Your Progress
        </h3>

        <div id="statistics-panel">

            <h3 id="statistics-title">
                Statistics
            </h3>

            <p id="total-jobs-container">
                Total Jobs:
                <span id="totalJobs">0</span>
            </p>

        </div>

    </div>

    

</body>
</html>
